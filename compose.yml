services:

    nginx:
      build: ./nginx
      ports:
        - "5000:80"

    server:
      build: ./server
      environment:
        DB_HOST: db
        DB_PORT: 3306
        DB_USER: ${DB_USER?DB_USER is not set, check your .env file}
        DB_PASSWORD: ${DB_PASSWORD?DB_PASSWORD is not set, check your .env file}
        DB_NAME: ${DB_NAME?DB_NAME is not set, check your .env file}
      deploy:
        replicas: 3
  
    db:
      image: mysql:8.0
      environment:
        MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD?DB_ROOT_PASSWORD is not set, check your .env file}
        MYSQL_DATABASE: ${DB_NAME?DB_NAME is not set, check your .env file}
        MYSQL_USER: ${DB_USER?DB_USER is not set, check your .env file}
        MYSQL_PASSWORD: ${DB_PASSWORD?DB_PASSWORD is not set, check your .env file}
      volumes:
        - db_data:/var/lib/mysql
        - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  db_data: