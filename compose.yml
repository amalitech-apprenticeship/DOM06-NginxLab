services:

    nginx:
      build: ./nginx
      ports:
        - "5000:80"
      networks:
        - shared
      depends_on:
        server:
          condition: service_healthy

    server:
      build: ./server
      environment:
        DB_HOST: db
        DB_PORT: 3306
        DB_USER: ${DB_USER?DB_USER is not set, check your .env file}
        DB_PASSWORD: ${DB_PASSWORD?DB_PASSWORD is not set, check your .env file}
        DB_NAME: ${DB_NAME?DB_NAME is not set, check your .env file}
      deploy:
        replicas: 3
      healthcheck:
        test: ["CMD", "node", "-e", "fetch('http://localhost:5000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
        interval: 30s
        timeout: 10s
        retries: 3
        start_period: 30s
        start_interval: 5s
      depends_on:
        db:
          condition: service_healthy
      networks:
        - isolated
        - shared
  
    db:
      image: mysql:8.0
      environment:
        MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD?DB_ROOT_PASSWORD is not set, check your .env file}
        MYSQL_DATABASE: ${DB_NAME?DB_NAME is not set, check your .env file}
        MYSQL_USER: ${DB_USER?DB_USER is not set, check your .env file}
        MYSQL_PASSWORD: ${DB_PASSWORD?DB_PASSWORD is not set, check your .env file}
      healthcheck:
        test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
        interval: 30s
        timeout: 10s
        retries: 3
      volumes:
        - db_data:/var/lib/mysql
        - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
      networks:
        - isolated

volumes:
  db_data:

networks:
  isolated:
    internal: true
  shared: